name: tp0
services:
  server:
    container_name: server
    image: server:latest
    entrypoint: python3 /main.py
    environment:
      - PYTHONUNBUFFERED=1
      - CANTIDAD_CLIENTES=5
    networks:
      - testing_net
    volumes:
      - ./server/config.ini:/config.ini
  client1:
    container_name: client1
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=1
      - NOMBRE=nombre1
      - APELLIDO=apellido1
      - DOCUMENTO=40000001
      - NACIMIENTO=1969-03-17
      - NUMERO=1
    networks:
      - testing_net
    depends_on:
      - server
    volumes:
      - ./client/config.yaml:/config.yaml
      - ./.data/agency-1.csv:/.data/agency-1.csv
  client2:
    container_name: client2
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=2
      - NOMBRE=nombre2
      - APELLIDO=apellido2
      - DOCUMENTO=40000002
      - NACIMIENTO=1956-01-14
      - NUMERO=2
    networks:
      - testing_net
    depends_on:
      - server
    volumes:
      - ./client/config.yaml:/config.yaml
      - ./.data/agency-2.csv:/.data/agency-2.csv
  client3:
    container_name: client3
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=3
      - NOMBRE=nombre3
      - APELLIDO=apellido3
      - DOCUMENTO=40000003
      - NACIMIENTO=1968-06-08
      - NUMERO=3
    networks:
      - testing_net
    depends_on:
      - server
    volumes:
      - ./client/config.yaml:/config.yaml
      - ./.data/agency-3.csv:/.data/agency-3.csv
  client4:
    container_name: client4
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=4
      - NOMBRE=nombre4
      - APELLIDO=apellido4
      - DOCUMENTO=40000004
      - NACIMIENTO=1997-08-05
      - NUMERO=4
    networks:
      - testing_net
    depends_on:
      - server
    volumes:
      - ./client/config.yaml:/config.yaml
      - ./.data/agency-4.csv:/.data/agency-4.csv
  client5:
    container_name: client5
    image: client:latest
    entrypoint: /client
    environment:
      - CLI_ID=5
      - NOMBRE=nombre5
      - APELLIDO=apellido5
      - DOCUMENTO=40000005
      - NACIMIENTO=1977-09-13
      - NUMERO=5
    networks:
      - testing_net
    depends_on:
      - server
    volumes:
      - ./client/config.yaml:/config.yaml
      - ./.data/agency-5.csv:/.data/agency-5.csv
networks:
  testing_net:
    ipam:
      driver: default
      config:
        - subnet: 172.25.125.0/24
